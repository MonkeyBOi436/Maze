[package]
name = "Maze"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"
image = "0.25.10"
[features]
scale = []
default = ["native"]  # Default feature includes "native"
native = ["dep:rayon"]    # The "native" feature enables Rayon
rayon = ["dep:rayon"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.7", optional = true }
